version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: inventory_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: inventory_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build: ./backend
    container_name: inventory_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://root:password@mysql_db:3306/inventory_db
      SECRET_KEY: ai_inventory_secret_key_change_in_production_2026
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      mysql_db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: inventory_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
